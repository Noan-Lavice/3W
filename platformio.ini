[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube

; ST-Link integre a la carte NUCLEO
upload_protocol = stlink
debug_tool = stlink

; Comme dans le workshop : utile pour le pas-a-pas
; -O0 = pas d'optimisation, -g = symboles de debug
debug_build_flags = -O0 -g

; Console serie du projet
monitor_speed = 115200
