; Projet Worldwide Weather Watcher - Station météo embarquée
; Carte NUCLEO-L476RG, framework STM32Cube (HAL de ST), code en C

[env:nucleo_l476rg]
platform  = ststm32          ; Famille de cartes STM32
board     = nucleo_l476rg    ; Modèle exact de la carte
framework = stm32cube        ; HAL officielle de STMicroelectronics

; Console série (UART2 par le câble USB du ST-Link)
monitor_speed = 115200

; Téléversement : copie sur le lecteur NOD_L476RG
upload_protocol = mbed

; Pour que printf sache afficher les nombres à virgule (%.1f)
build_flags = -Wl,-u,_printf_float

; Débogage avec le ST-Link
debug_tool        = stlink      ; Le ST-Link de la carte
debug_build_flags = -O0 -g      ; -O0 : pas d'optimisation, -g : symboles de débogage
