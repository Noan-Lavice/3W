[platformio]
default_envs = release

[env]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube

upload_protocol = stlink

monitor_speed = 115200

[env:debug]
build_type = debug
build_flags =
    -D DEBUG
    -Wall
    -Wextra

[env:release]
build_type = release
build_flags =
    -D RELEASE
    -Wall
    -Wextra